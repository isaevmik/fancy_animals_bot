[project]
name = "fancy-animals-bot"
version = "0.1.0"
description = "Bot for animal shelters"
authors = [
    {name = "Mikhail Isaev"}
]
readme = "README.md"
requires-python = ">=3.11.0,<3.15"
dependencies = [
    "fastapi[all] (>=0.128.0,<0.129.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "alembic (>=1.18.1,<2.0.0)",
    "sqlalchemy (>=2.0.45,<3.0.0)",
    "aiogram (>=3.24.0,<4.0.0)"
]

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "mypy (>=1.19.1,<2.0.0)",
    "ruff (>=0.14.13,<0.15.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
